[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mutualvote"
version = "0.0.1"
description = "Mutual Vote: statistical density clustering with subjective logic (Haydar & Boyer, UMAP'17)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Charif Haydar" }]
dependencies = ["numpy>=1.21", "scipy>=1.7"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.0"]
dev = ["pytest>=7", "hypothesis>=6", "ruff>=0.5", "mypy>=1.8", "pre-commit>=3", "scikit-learn>=1.0"]

[project.scripts]
mutualvote = "mutualvote.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mutualvote"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true
